name: Windows-EXE bauen

# Diese Datei nach .github/workflows/build-exe.yml im Repo einchecken.
# Danach: Tab "Actions" auf GitHub -> "Windows-EXE bauen" -> "Run workflow".
# Nach ein paar Minuten gibt es unter dem Workflow-Lauf einen Download
# "Schnittinator-windows" mit der fertigen exe (kein Windows-PC noetig).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: EXE bauen
        run: pyinstaller Schnittinator.spec

      - name: Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Schnittinator-windows
          path: dist/Schnittinator/
